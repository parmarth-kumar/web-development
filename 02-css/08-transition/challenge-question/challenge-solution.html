<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Interaction Card Solution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Transition Interaction Card</h1>

    <div class="card-container">
        <div class="card" tabindex="0">
            <h2>Interactive Card</h2>
            <p>Hover or focus on this card to see smooth CSS transitions affecting color, transform, and shadow.</p>
            <button class="card-btn">Click Me</button>
        </div>
    </div>
</body>
</html>
