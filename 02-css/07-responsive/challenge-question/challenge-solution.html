<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Pricing Grid Solution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Responsive Pricing Grid</h1>

    <div class="pricing-grid">
        <div class="pricing-card">
            <h2>Basic</h2>
            <p class="price">$9 / month</p>
            <ul>
                <li>1 Project</li>
                <li>Basic Support</li>
                <li>1GB Storage</li>
            </ul>
            <button>Choose Plan</button>
        </div>

        <div class="pricing-card featured">
            <h2>Pro</h2>
            <p class="price">$29 / month</p>
            <ul>
                <li>10 Projects</li>
                <li>Priority Support</li>
                <li>10GB Storage</li>
            </ul>
            <button>Choose Plan</button>
        </div>

        <div class="pricing-card">
            <h2>Enterprise</h2>
            <p class="price">$99 / month</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>24/7 Support</li>
                <li>100GB Storage</li>
            </ul>
            <button>Choose Plan</button>
        </div>
    </div>
</body>
</html>
